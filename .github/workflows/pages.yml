name: Publish Static Research Report to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic demonstration report site
        run: |
          python scripts/prepare_data.py --dataset synthetic_primary --synthetic-demo --num-primary 60 --num-external 30 --seed 42
          python scripts/prepare_data.py --dataset synthetic_external --seed 42
          python scripts/train.py --manifest synthetic_primary --external-manifest synthetic_external --model custom_cnn --epochs 2 --image-size 128 --seed 42
          python scripts/generate_report.py
          mkdir -p _site
          cp reports/generated/retinax_research_report.html _site/index.html
          cp -r reports/generated/figures _site/figures
          cp reports/generated/retinax_research_report.pdf _site/retinax_research_report.pdf
          cp reports/generated/retinax_research_report_runs.csv _site/retinax_research_report_runs.csv

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Sync Gradio App to Hugging Face Spaces

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  sync-to-hub:
    # Runs only after HF_TOKEN and HF_SPACE_REPO repository secrets/variables are configured
    if: ${{ vars.HF_SPACE_REPO != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject Hugging Face Spaces YAML frontmatter for sync branch
        run: |
          python -c '
          from pathlib import Path
          frontmatter = """---
          title: RetinaX
          emoji: "\U0001F441\uFE0F"
          colorFrom: indigo
          colorTo: teal
          sdk: gradio
          sdk_version: 5.9.1
          python_version: "3.12"
          app_file: run.py
          pinned: false
          license: mit
          ---

          """
          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          if not text.lstrip().startswith("---"):
              readme.write_text("\n".join(line.lstrip() for line in frontmatter.splitlines()) + "\n" + text, encoding="utf-8")
          '
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: add Hugging Face Spaces frontmatter" || true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
        run: |
          git push --force https://hf_user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO} HEAD:main

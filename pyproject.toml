[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retinax"
version = "0.1.0"
description = "RetinaX: A Research-Driven Framework for Robust and Trustworthy Retinal Image Intelligence"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
    {name = "RetinaX Research Engineering"}
]
dependencies = [
    "numpy>=1.26.4,<2.0.0",
    "scipy>=1.12.0,<1.15.0",
    "pandas>=2.2.0,<2.3.0",
    "scikit-learn>=1.4.0,<1.6.0",
    "PyYAML>=6.0.1",
    "tqdm>=4.66.0",
    "torch>=2.2.0,<2.4.0",
    "torchvision>=0.17.0,<0.19.0",
    "timm>=0.9.16,<1.1.0",
    "opencv-python-headless>=4.9.0,<4.11.0",
    "Pillow>=10.2.0,<11.2.0",
    "albumentations>=1.4.0,<1.4.18",
    "matplotlib>=3.8.0,<3.10.0",
    "seaborn>=0.13.2,<0.14.0",
    "gradio>=4.44.0,<5.10.0",
    "tensorboard>=2.16.0,<2.19.0",
    "fpdf2>=2.7.9,<2.9.0",
    "captum>=0.7.0,<0.8.0",
    "monai>=1.3.0,<1.5.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
foundation = [
    "open_clip_torch>=2.24.0,<2.30.0",
    "transformers>=4.38.0,<4.47.0",
]
datasets = [
    "medmnist>=3.0.1",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
